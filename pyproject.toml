[project]
name = "dps150"
version = "0.1.0"
description = "Python driver and CLI for the FNIRSI DPS-150 programmable power supply, with safety guardrails"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
dps150 = "dps150.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sends_forbidden_command: the test itself writes a forbidden host frame on purpose"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
